name: communication-lab-kafka
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres-password
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  zipkin:
    image: openzipkin/zipkin:3.5
    ports:
    - 127.0.0.1:9411:9411
  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      AUTH_ISSUER: http://localhost:9000
    ports:
    - 127.0.0.1:9000:9000
  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: lab
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      AUTH_ISSUER: http://localhost:9000
      AUTH_JWKS: http://auth-service:9000/oauth2/jwks
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      EUREKA_URL: http://discovery-server:8761/eureka/
      INSTANCE_ID: inventory-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
    - 127.0.0.1:8083:8083
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: lab
      DB_URL: jdbc:postgresql://postgres:5432/payments
      AUTH_ISSUER: http://localhost:9000
      AUTH_JWKS: http://auth-service:9000/oauth2/jwks
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      EUREKA_URL: http://discovery-server:8761/eureka/
      INSTANCE_ID: payment-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
    - 127.0.0.1:8082:8082
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      SPRING_PROFILES_ACTIVE: lab
      DB_URL: jdbc:postgresql://postgres:5432/orders
      AUTH_ISSUER: http://localhost:9000
      AUTH_JWKS: http://auth-service:9000/oauth2/jwks
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      EUREKA_URL: http://discovery-server:8761/eureka/
      INSTANCE_ID: order-1
      AUTH_TOKEN_URL: http://auth-service:9000/oauth2/token
      PAYMENT_URL: http://payment-service:8082
      INVENTORY_URL: http://inventory-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
  kafka:
    image: apache/kafka:4.1.2
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:29092
      - --list
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
volumes:
  postgres-data: {}
  kafka-data: {}
