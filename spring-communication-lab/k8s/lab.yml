apiVersion: v1
kind: Namespace
metadata:
  name: communication-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-database
  namespace: communication-lab
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: communication-lab
data:
  01-init.sql: '-- Separate owners and databases: services cannot query one another''s
    tables.

    create user "order" with password ''order-password'';

    create user payment with password ''payment-password'';

    create user inventory with password ''inventory-password'';

    create database orders owner "order";

    create database payments owner payment;

    create database inventory owner inventory;

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: communication-lab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: communication-lab
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        envFrom:
        - secretRef:
            name: lab-database
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: communication-lab
spec:
  selector:
    app: postgres
  ports:
  - name: p5432
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: kafka
        image: apache/kafka:4.1.2
        ports:
        - containerPort: 29092
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: INTERNAL://:29092,CONTROLLER://:29093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka:29092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:29093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_HEAP_OPTS
          value: -Xms256m -Xmx512m
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        readinessProbe:
          exec:
            command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - localhost:29092
            - --list
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: communication-lab
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 29092
    targetPort: 29092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin:3.5
        ports:
        - containerPort: 9411
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: communication-lab
spec:
  selector:
    app: zipkin
  ports:
  - name: p9411
    port: 9411
    targetPort: 9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: communication-lab/auth-service:1.0.0
        ports:
        - containerPort: 9000
        env:
        - name: AUTH_ISSUER
          value: http://localhost:9000
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: communication-lab
spec:
  selector:
    app: auth-service
  ports:
  - name: p9000
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: communication-lab/inventory-service:1.0.0
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: lab
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/inventory
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:29092
        - name: AUTH_ISSUER
          value: http://localhost:9000
        - name: AUTH_JWKS
          value: http://auth-service:9000/oauth2/jwks
        - name: ZIPKIN_URL
          value: http://zipkin:9411/api/v2/spans
        - name: INSTANCE_ID
          value: inventory-1
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=65
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: communication-lab
spec:
  selector:
    app: inventory-service
  ports:
  - name: p8083
    port: 8083
    targetPort: 8083
---
