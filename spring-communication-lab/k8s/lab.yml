apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: communication-lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: communication-lab/order-service:1.0.0
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: lab
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/orders
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:29092
        - name: AUTH_ISSUER
